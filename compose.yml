services:
  db-catalog:
    image: postgres:16-alpine
    container_name: db-catalog
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-orders:
    image: postgres:16-alpine
    container_name: db-orders
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - db_orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  ms-catalog:
    build:
      context: ./ms-catalog
      dockerfile: Dockerfile
    container_name: ms-catalog
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-catalog:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_LIQUIBASE_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db-catalog:
        condition: service_healthy

  ms-orders:
    build:
      context: ./ms-orders
      dockerfile: Dockerfile
    container_name: ms-orders
    environment:
      SERVER_PORT: 8080
      DB_URL: db-orders:5432/mydatabase
      DB_USERNAME: myuser
      DB_PASSWORD: secret
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-orders:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      MS_CATALOG: http://ms-catalog:8080
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: pedidos360@example.test
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
      APP_RABBITMQ_EXCHANGE: notifications.exchange
      APP_RABBITMQ_ROUTINGKEY: notifications.routingkey
    ports:
      - "8081:8080"
    depends_on:
      db-orders:
        condition: service_healthy
      ms-catalog:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  ms-notifications:
    build:
      context: ./ms-notifications
      dockerfile: Dockerfile
    container_name: ms-notifications
    environment:
      SERVER_PORT: 8080
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
      APP_RABBITMQ_EXCHANGE: notifications.exchange
      APP_RABBITMQ_QUEUE: notifications.queue
      APP_RABBITMQ_ROUTINGKEY: notifications.routingkey
    ports:
      - "8082:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # nginx.conf proxies /api/... to the services below
        VITE_API_BASE_URL: http://localhost:5173
        VITE_REDIRECT_URI: http://localhost:5173
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      ms-catalog:
        condition: service_started
      ms-orders:
        condition: service_started
      ms-notifications:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_catalog_data:
  db_orders_data:
  rabbitmq_data:
  mailpit_data:
